name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate Release Version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["TAG_NAME"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"Invalid release tag {tag!r}; expected vX.Y.Z")

          with Path("gradle/libs.versions.toml").open("rb") as catalog_file:
              versions = tomllib.load(catalog_file)["versions"]
          version_name = versions["versionName"]
          version_code = int(versions["versionCode"])
          if tag != f"v{version_name}":
              raise SystemExit(
                  f"Tag {tag} does not match versionName {version_name!r}"
              )

          # The backend and Android fallback use the same code-owned release policy.
          with Path("common/src/main/resources/version-policy.json").open(encoding="utf-8") as policy_file:
              policy = json.load(policy_file)
          if not 1 <= policy["minSupportedVersionCode"] <= policy["deprecatedVersionCode"] <= policy["latestVersionCode"] <= version_code:
              raise SystemExit("Release policy has inconsistent bounds")
          if policy["latestVersionCode"] != version_code or policy["latestVersionName"] != version_name:
              raise SystemExit("Release policy must match the release version")
          if policy["deprecatedVersionCode"] < 4:
              raise SystemExit("Clients predating server support must remain deprecated")
          PY

      - name: Validate Release Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GitHub Secret 'KEYSTORE_BASE64' is missing or empty!"
            exit 1
          fi
          
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::GitHub Secret 'STORE_PASSWORD' is missing or empty!"
            exit 1
          fi
          
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::GitHub Secret 'KEY_ALIAS' is missing or empty!"
            exit 1
          fi
          
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::GitHub Secret 'KEY_PASSWORD' is missing or empty!"
            exit 1
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d -i > "$RUNNER_TEMP/keystore.jks"
          
          if [ ! -s "$RUNNER_TEMP/keystore.jks" ]; then
            echo "::error::Decoded keystore.jks is empty or invalid base64!"
            exit 1
          fi
          
          echo "Decoded Keystore size: $(stat -c%s "$RUNNER_TEMP/keystore.jks") bytes"

      - name: Validate Keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "=== Keystore information ==="
          
          if ! keytool -list \
              -keystore "$RUNNER_TEMP/keystore.jks" \
              -storepass "$STORE_PASSWORD"; then
            echo "::error::Unable to open the keystore. Check STORE_PASSWORD."
            exit 1
          fi
          
          echo ""
          echo "=== Configured alias ==="
          echo "KEY_ALIAS is configured: true"
          
          if ! keytool -list \
              -keystore "$RUNNER_TEMP/keystore.jks" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::The configured KEY_ALIAS '$KEY_ALIAS' was not found in the keystore."
            exit 1
          fi
          
          echo "Configured alias '$KEY_ALIAS' validated successfully."

      - name: Run Unit Tests
        run: ./gradlew :android:testDebugUnitTest :backend:check

      - name: Build Release Artifacts
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :android:assembleRelease :android:bundleRelease

      - name: Prepare Release Artifacts & Checksums
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          APK_PATH="android/build/outputs/apk/release/android-release.apk"
          AAB_PATH="android/build/outputs/bundle/release/android-release.aab"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi
          
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::Release AAB was not generated."
            exit 1
          fi
          
          mkdir -p artifacts
          
          cp "$APK_PATH" "artifacts/DietReminder-${TAG_NAME}.apk"
          cp "$AAB_PATH" "artifacts/DietReminder-${TAG_NAME}.aab"
          
          cd artifacts
          sha256sum *.apk *.aab > SHA256SUMS.txt
          
          echo "=== Release artifacts ==="
          ls -lh
          
          echo ""
          echo "=== SHA-256 checksums ==="
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Publish ${{ matrix.component }} image
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, web]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
