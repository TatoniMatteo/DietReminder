name: Android Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Release Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GitHub Secret 'KEYSTORE_BASE64' is missing or empty!"
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::GitHub Secret 'STORE_PASSWORD' is missing or empty!"
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::GitHub Secret 'KEY_ALIAS' is missing or empty!"
            exit 1
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/keystore.jks
          if [ ! -s $RUNNER_TEMP/keystore.jks ]; then
            echo "::error::Decoded keystore.jks is empty or invalid base64!"
            exit 1
          fi
          echo "=== Keystore verification ==="
          keytool -list -keystore $RUNNER_TEMP/keystore.jks -storepass "$STORE_PASSWORD" | grep -i "Alias" || true

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
