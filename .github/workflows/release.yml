name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Release Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GitHub Secret 'KEYSTORE_BASE64' is missing or empty!"
            exit 1
          fi
          
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::GitHub Secret 'STORE_PASSWORD' is missing or empty!"
            exit 1
          fi
          
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::GitHub Secret 'KEY_ALIAS' is missing or empty!"
            exit 1
          fi
          
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::GitHub Secret 'KEY_PASSWORD' is missing or empty!"
            exit 1
          fi

      - name: Validate Release Tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$TAG_NAME'. Expected format: v1.2.3"
            exit 1
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d -i > "$RUNNER_TEMP/keystore.jks"
          
          if [ ! -s "$RUNNER_TEMP/keystore.jks" ]; then
            echo "::error::Decoded keystore.jks is empty or invalid base64!"
            exit 1
          fi
          
          echo "Decoded Keystore size: $(stat -c%s "$RUNNER_TEMP/keystore.jks") bytes"

      - name: Validate Keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "=== Keystore information ==="
          
          if ! keytool -list \
              -keystore "$RUNNER_TEMP/keystore.jks" \
              -storepass "$STORE_PASSWORD"; then
            echo "::error::Unable to open the keystore. Check STORE_PASSWORD."
            exit 1
          fi
          
          echo ""
          echo "=== Configured alias ==="
          echo "KEY_ALIAS is configured: true"
          
          if ! keytool -list \
              -keystore "$RUNNER_TEMP/keystore.jks" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::The configured KEY_ALIAS '$KEY_ALIAS' was not found in the keystore."
            exit 1
          fi
          
          echo "Configured alias '$KEY_ALIAS' validated successfully."

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release Artifacts
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Prepare Release Artifacts & Checksums
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi
          
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::Release AAB was not generated."
            exit 1
          fi
          
          mkdir -p artifacts
          
          cp "$APK_PATH" "artifacts/DietReminder-${TAG_NAME}.apk"
          cp "$AAB_PATH" "artifacts/DietReminder-${TAG_NAME}.aab"
          
          cd artifacts
          sha256sum *.apk *.aab > SHA256SUMS.txt
          
          echo "=== Release artifacts ==="
          ls -lh
          
          echo ""
          echo "=== SHA-256 checksums ==="
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
