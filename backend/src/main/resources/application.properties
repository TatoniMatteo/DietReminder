spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dietreminder}
spring.datasource.username=${DB_USERNAME:dietreminder}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
auth.session-hours=${AUTH_SESSION_HOURS:720}
auth.attempt-limit=${AUTH_ATTEMPT_LIMIT:30}
auth.mail-from=${AUTH_MAIL_FROM:no-reply@dietreminder.local}
# Configure spring.mail.host/port/username/password using SPRING_MAIL_* environment variables.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true
spring.jackson.deserialization.fail-on-unknown-properties=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# OAuth secrets are server-only; the public client ID is discoverable by clients.
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.drive-redirect-uri=${GOOGLE_DRIVE_REDIRECT_URI:}
google.token-encryption-key=${GOOGLE_TOKEN_ENCRYPTION_KEY:}
web.secure-cookies=${WEB_SECURE_COOKIES:true}
server.tomcat.max-http-form-post-size=10MB
