map $uri $cache_policy {
    default "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

# The public HTTPS proxy terminates TLS and supplies this header.
map $http_x_forwarded_proto $public_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    add_header Cache-Control $cache_policy always;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Resolve again after backend recreation during rolling image updates.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8080;
    location = /healthz {
        proxy_pass http://$backend_upstream/actuator/health/readiness;
    }
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
