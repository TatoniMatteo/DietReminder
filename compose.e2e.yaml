# Used only by scripts/test-web-e2e.sh with a unique Compose project and fresh DB.
services:
  backend:
    image: ${BACKEND_IMAGE:-dietreminder-e2e-backend:local}
    environment:
      # A full browser matrix creates many independent accounts from the same IP.
      AUTH_ATTEMPT_LIMIT: 1000

  web:
    image: ${WEB_IMAGE:-dietreminder-e2e-web:local}
